<?xml version="1.0" encoding="UTF-8"?>
<!-- qcnote 应用图标母版：蓝色圆角底板 + 白色填充文档 + 右上折角 + 三条文字线条 -->
<!-- 设计约束：16px 下文档轮廓与线条仍可辨认，元素间距按 1024 比例不小于 60px -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 底板：圆角正方形（rx 约 22%），AppTheme 亮色 accent 蓝，平色无渐变无描边 -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" fill="#3564d4"/>

  <!-- 文档主体：白色填充，占底板宽约 56%，竖直居中；右上角沿对角线切口留出折角位 -->
  <path fill="#ffffff" d="M 272,142
                         H 660
                         L 800,282
                         V 834
                         Q 800,882 752,882
                         H 272
                         Q 224,882 224,834
                         V 190
                         Q 224,142 272,142
                         Z"/>

  <!-- 折角：浅蓝面（等效 60% 白叠底板色，比文档白稍深），叠于文档右上切口内侧 -->
  <path fill="#aec3f4" d="M 660,142 V 282 H 800 Z"/>

  <!-- 三条文字线条：底色圆角矩形切口（白色文档上的镂空），宽度约为文档宽的 60%/75%/45% -->
  <rect x="288" y="400" width="346" height="42" rx="21" fill="#3564d4"/>
  <rect x="288" y="530" width="432" height="42" rx="21" fill="#3564d4"/>
  <rect x="288" y="660" width="259" height="42" rx="21" fill="#3564d4"/>
</svg>
